# Runs on every push and pull request. Make it required before merging:
# GitHub → Settings → Branches → Add rule for "main" → Require status checks → "checks".
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model runtime
        run: pip install numpy onnxruntime

      - name: Model quality gate (personas, rules, no regression vs eval/baseline.json)
        run: python evaluate.py

      - name: Download size budget
        run: python tools/size_budget.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Netlify function tests
        run: node tests/functions.mjs

      - name: Install browser test
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Browser smoke test (CPU slowed 4x ~ mid-range phone)
        run: |
          python -m http.server 8080 --bind 127.0.0.1 -d site &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/index.html >/dev/null && break; sleep 0.5; done
          BASE_URL=http://localhost:8080 node tests/smoke.mjs
